<header
  *transloco="let t"
  class="sticky top-0 z-50 flex items-center justify-between border-b border-gray-200 bg-white px-6 py-4 text-gray-900 dark:border-line dark:bg-ink dark:text-paper sm:px-10"
>
  <a
    routerLink="/"
    class="flex items-center gap-2 font-display text-lg font-semibold tracking-tight"
  >
    <img src="assets/img/crime-logo-128.png" alt="" width="32" height="32" class="h-8 w-8" />
    Crime
  </a>

  <nav class="flex items-center gap-6 text-sm text-gray-500 dark:text-muted">
    <a
      routerLink="/mappa"
      routerLinkActive="text-gray-900 dark:text-paper"
      class="transition-colors hover:text-gray-900 dark:hover:text-paper"
    >
      {{ t('nav.mappa') }}
    </a>
    @if (auth.isAdmin()) {
      <a
        routerLink="/gestione"
        routerLinkActive="text-gray-900 dark:text-paper"
        class="transition-colors hover:text-gray-900 dark:hover:text-paper"
      >
        {{ t('nav.gestione') }}
      </a>
    }
  </nav>

  <div class="relative flex items-center gap-3">
    @if (!auth.autenticato()) {
      <a
        routerLink="/login"
        class="rounded-sm px-3 py-1.5 text-sm font-medium text-gray-700 transition-colors hover:bg-black/5 hover:text-gray-900 dark:text-paper dark:hover:bg-white/10"
      >
        {{ t('nav.accedi') }}
      </a>
    }
    <button
      type="button"
      (click)="toggleImpostazioni()"
      [attr.aria-expanded]="pannelloAperto()"
      aria-label="Impostazioni"
      class="flex h-8 w-8 items-center justify-center rounded-sm text-gray-500 transition-colors hover:bg-black/5 hover:text-gray-900 dark:text-muted dark:hover:bg-white/10 dark:hover:text-paper"
    >
      <svg lucideIcon="settings" class="h-4 w-4"></svg>
    </button>

    @if (pannelloAperto()) {
      <div
        class="absolute top-full right-0 z-50 mt-2 w-56 rounded-sm border border-gray-200 bg-white p-3 shadow-lg dark:border-line dark:bg-panel"
      >
        @if (auth.utente(); as utente) {
          <div class="border-b border-gray-200 px-1 pb-3 mb-3 dark:border-line">
            <p class="truncate text-sm font-medium text-gray-900 dark:text-paper">
              {{ utente.nome }} {{ utente.cognome }}
            </p>
            <p class="truncate text-xs text-gray-400 dark:text-muted">{{ utente.email }}</p>
            <button
              type="button"
              (click)="esci()"
              class="mt-2 flex items-center gap-1.5 rounded-sm text-xs font-medium text-gray-500 transition-colors hover:text-gray-900 dark:text-muted dark:hover:text-paper"
            >
              <svg lucideIcon="log-out" class="h-3.5 w-3.5"></svg>
              {{ t('nav.esci') }}
            </button>
          </div>
        }
        <div class="flex items-center justify-between px-1 pb-3">
          <span class="text-xs font-medium text-gray-400 dark:text-muted">Lingua</span>
          <div class="flex items-center gap-1.5 text-xs text-gray-500 dark:text-muted">
            <button
              type="button"
              (click)="impostaLingua('it')"
              [ngClass]="{ 'text-gray-900 dark:text-paper': linguaAttiva() === 'it' }"
              class="rounded-sm px-2 py-1 transition-colors hover:text-gray-900 dark:hover:text-paper"
            >
              IT
            </button>
            <span class="text-gray-300 dark:text-line">/</span>
            <button
              type="button"
              (click)="impostaLingua('en')"
              [ngClass]="{ 'text-gray-900 dark:text-paper': linguaAttiva() === 'en' }"
              class="rounded-sm px-2 py-1 transition-colors hover:text-gray-900 dark:hover:text-paper"
            >
              EN
            </button>
          </div>
        </div>

        <div
          class="flex items-center justify-between border-t border-gray-200 px-1 pt-3 dark:border-line"
        >
          <span class="text-xs font-medium text-gray-400 dark:text-muted">Tema</span>
          <app-theme-toggle />
        </div>
      </div>
    }
  </div>
</header>
