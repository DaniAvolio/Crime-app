server:
  # Risposte JSON compresse (gzip): /vicine passa da ~50 KB a pochi KB, conta su rete mobile.
  compression:
    enabled: true
    mime-types: application/json
    min-response-size: 1KB

spring:
  application:
    name: crime-app-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/crimeapp
    username: crimeapp_user
    password: changeme_local_dev
  jpa:
    hibernate:
      # Lo schema è governato da Flyway (db/migration): Hibernate si limita a
      # validare che le entity mapping corrispondano allo schema reale.
      ddl-auto: validate
    properties:
      hibernate:
        # Le relazioni LAZY (es. l'autore di ogni segnalazione in /vicine) si caricano a blocchi
        # con una query "in (...)" invece di una query per riga (problema N+1).
        default_batch_fetch_size: 50
  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  file:
    name: logs/crime-app.log
  logback:
    rollingpolicy:
      file-name-pattern: logs/crime-app-%d{yyyy-MM-dd}.%i.log
      max-file-size: 10MB
      max-history: 30
      total-size-cap: 1GB
  level:
    root: INFO
    com.daniele.crime_app_backend: DEBUG
    # Sostituisce spring.jpa.show-sql: così le query passano dal logger e finiscono anche nel file.
    org.hibernate.SQL: DEBUG
    # Decommentare per vedere anche i valori dei parametri bindati nelle query.
    # org.hibernate.orm.jdbc.bind: TRACE

crimeapp:
  moderazione:
    # Somma dei pesi degli abusi in attesa a cui una Segnalazione viene sospesa automaticamente.
    # Ogni abuso pesa la fiducia del segnalante / 100 (minimo 0.25): 4 utenti con fiducia piena.
    soglia-peso-abusi: 4.0
  segnalazioni:
    # Intervallo (ms) del job che porta in SCADUTA le segnalazioni ATTIVA con data di scadenza passata.
    scadenza-job-rate-ms: 300000
    # Numero di voti "non più in atto" (successivi all'ultimo "ancora in atto") che portano una Segnalazione in SCADUTA.
    soglia-non-in-atto: 3
    anonimizzazione:
      # Mesi dopo la chiusura (SCADUTA o RIMOSSA) oltre i quali una segnalazione viene anonimizzata.
      mesi: 12
      # Quando gira il job (cron Spring: secondi minuti ore giorno mese giorno-settimana), di notte.
      cron: "0 30 3 * * *"
      # Segnalazioni per transazione: blocchi piccoli non tengono lock a lungo.
      dimensione-blocco: 1000
  auth:
    # Chiave HMAC (HS256) per firmare i JWT: almeno 32 byte. In produzione va
    # fornita tramite la variabile d'ambiente CRIMEAPP_JWT_SECRET.
    jwt-secret: ${CRIMEAPP_JWT_SECRET:dev-only-secret-cambiami-in-produzione-0123456789}
    # Validità del token di accesso, in minuti.
    jwt-durata-minuti: 1440
    # Email del primo amministratore: alla registrazione (o al prossimo avvio, se già
    # registrato) quell'utente diventa ADMIN. Vuota = nessun effetto.
    admin-email: ${CRIMEAPP_ADMIN_EMAIL:}
