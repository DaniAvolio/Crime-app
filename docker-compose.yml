version: '3.8'

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: crime-app-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: crimeapp
      POSTGRES_USER: crimeapp_user
      POSTGRES_PASSWORD: changeme_local_dev
    ports:
      - "5432:5432"
    volumes:
      - crimeapp_pgdata:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: crime-app-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@local.dev
      PGADMIN_DEFAULT_PASSWORD: changeme_local_dev
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  crimeapp_pgdata: